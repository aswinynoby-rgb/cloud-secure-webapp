{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card p-4 mt-4">

            <!-- TITLE -->
            <div class="text-center mb-4">
                <i class="fas fa-plus-circle fa-3x text-primary"></i>
                <h2 class="mt-2">Add New Course</h2>
                <p class="text-muted">
                    Fill in the details below
                </p>
            </div>

            <!-- ADD COURSE FORM -->
            <form method="POST"
                  action="{{ url_for('main.add_course') }}">

                <!-- COURSE TITLE -->
                <div class="mb-3">
                    <label class="form-label">
                        <i class="fas fa-heading"></i>
                        Course Title
                    </label>
                    <input type="text"
                           name="title"
                           class="form-control"
                           placeholder="e.g. Python for Beginners"
                           required>
                </div>

                <!-- COURSE DESCRIPTION -->
                <div class="mb-3">
                    <label class="form-label">
                        <i class="fas fa-align-left"></i>
                        Description
                    </label>
                    <textarea name="description"
                              class="form-control"
                              rows="4"
                              placeholder="Describe what students will learn..."
                              required></textarea>
                </div>

                <!-- VIDEO URL -->
                <div class="mb-3">
                    <label class="form-label">
                        <i class="fas fa-video"></i>
                        Video URL
                    </label>
                    <input type="text"
                           name="video_url"
                           class="form-control"
                           placeholder="e.g. https://www.youtube.com/embed/xxxxx">
                    <small class="text-muted">
                        Use YouTube embed URL format
                    </small>
                </div>

                <!-- BUTTONS -->
                <div class="d-grid gap-2 mt-4">
                    <button type="submit"
                            class="btn btn-primary btn-lg">
                        <i class="fas fa-plus"></i>
                        Add Course
                    </button>
                    <a href="{{ url_for('main.admin_dashboard') }}"
                       class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left"></i>
                        Back to Dashboard
                    </a>
                </div>

            </form>

        </div>
    </div>
</div>

{% endblock %}
